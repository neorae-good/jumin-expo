<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<style>
@font-face { font-family: "Pretendard"; src: url("assets/fonts/pretendard-bold.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Pretendard"; src: url("assets/fonts/pretendard-semibold.woff2") format("woff2"); font-weight: 600; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f3efe6; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f3efe6; }
.layer { position: absolute; inset: 0; overflow: hidden; }
/* real region photos drifting behind the stage; only the letters let them through */
#photo { position: absolute; left: 0; top: 0; width: 7680px; height: 1080px; transform-origin: 0 0; }
#photo img { display: block; width: 7680px; height: 1080px; filter: saturate(1.12) contrast(1.06); }
/* stage = porcelain sheet with black letters, screen-blended: black letters become windows onto the photos */
#stage svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
#stage::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(255,255,255,0) 55%, rgba(215,205,185,.0) 100%); }

#word span { position: absolute; left: 0; right: 0; top: 560px; transform: translateY(-50%); text-align: center; font-family: "Pretendard", sans-serif; font-weight: 700; font-size: 400px; line-height: 1; letter-spacing: -0.02em; color: #000; white-space: nowrap; }
/* soft coloured shadow under the window so the letters read as cut into the sheet */
#shadow { position: absolute; left: 0; right: 0; top: 563px; transform: translateY(-50%); text-align: center; font-family: "Pretendard", sans-serif; font-weight: 700; font-size: 400px; line-height: 1; letter-spacing: -0.02em; color: rgba(120, 85, 30, .18); filter: blur(14px); white-space: nowrap; }
.cap { position: absolute; left: 0; right: 0; text-align: center; font-family: "Pretendard", sans-serif; color: #2a1a0c; opacity: 0; }
#eyebrow { top: 230px; font-size: 40px; font-weight: 600; letter-spacing: .32em; }
#sub { top: 800px; font-size: 52px; font-weight: 700; letter-spacing: .5em; color: #7a5420; }
#fade { background: #000; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
  <div id="pl" class="layer clip" data-start="0" data-duration="4" data-track-index="1"><div id="photo"><img src="strip.jpg" alt=""></div></div>
  <div id="sh" class="layer clip" data-start="0" data-duration="4" data-track-index="2"><div id="shadow">주민자치</div></div>
  <div id="stage" class="layer clip" data-start="0" data-duration="4" data-track-index="3">
    <svg viewBox="0 0 1920 1080"><defs><mask id="hole" maskUnits="userSpaceOnUse" x="-100000" y="-100000" width="200000" height="200000">
      <rect x="-100000" y="-100000" width="200000" height="200000" fill="#fff"/>
      <g id="word"><text x="960" y="700" text-anchor="middle" font-family="Pretendard" font-weight="700" font-size="400" letter-spacing="-8" fill="#000">주민자치</text></g>
    </mask></defs>
    <rect x="-100000" y="-100000" width="200000" height="200000" fill="#f3efe6" mask="url(#hole)"/></svg>
  </div>
  <div id="tx" class="layer clip" data-start="0" data-duration="4" data-track-index="4">
    <div id="eyebrow" class="cap">2026 제8회 경상남도</div>
    <div id="sub" class="cap">주민자치 박람회</div>
  </div>
</div>
<script>
// after video-shotcraft "text-as-mask" (Apache-2.0): letters are the window, the content drifts inside,
// a short inhale, then the letters rush open and the photo takes over the screen.
const tl = gsap.timeline({ paused: true });
const O = { x: 1230, y: 537 };
// entrance (0-0.6 s): letters wipe up from the baseline and settle
tl.fromTo('#word', { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 0);
tl.fromTo('#shadow', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'sine.out' }, 0.1);
tl.fromTo('#eyebrow', { opacity: 0, letterSpacing: '0.6em' }, { opacity: 1, letterSpacing: '0.32em', duration: 0.7, ease: 'power2.out' }, 0.2);
tl.fromTo('#sub', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 0.35);
// drift (0-2.7 s): the photos slide behind the letters
tl.fromTo('#photo', { x: -300 }, { x: -1500, duration: 2.75, ease: 'sine.inOut' }, 0);
// inhale (2.45-2.75 s)
tl.to('#word', { scale: 0.965, svgOrigin: O.x + ' ' + O.y, duration: 0.3, ease: 'power2.inOut' }, 2.45);
tl.to(['#eyebrow', '#sub', '#shadow'], { opacity: 0, duration: 0.3, ease: 'power2.in' }, 2.45);
// rush (2.75-3.55 s): exponential zoom through a solid stroke, stroke pulled to frame centre
const rush = { t: 0 };
tl.to(rush, { t: 1, duration: 0.8, ease: 'none', onUpdate: () => {
  const k = Math.pow(rush.t, 1.8);
  const S = 0.965 * Math.pow(46 / 0.965, k);
  gsap.set('#word', { scale: S, svgOrigin: O.x + ' ' + O.y, x: (960 - O.x) * rush.t, y: (540 - O.y) * rush.t });
} }, 2.75);
// the photo settles to a clean full-frame (expo-out, slightly after the rush) and the sheet hands over
tl.to('#photo', { x: -1920, duration: 0.9, ease: 'expo.out' }, 2.75);
tl.to('#stage', { opacity: 0, duration: 0.25, ease: 'none' }, 3.3);
// hold (3.55-4 s): the photo stays alive with a tiny push
tl.fromTo('#pl', { scale: 1.0 }, { scale: 1.02, duration: 0.6, ease: 'none', immediateRender: false }, 3.4);
window.__timelines = window.__timelines || {};
window.__timelines['main'] = tl;
</script>
</body>
</html>
